# Builds the Z-SHIRTS Team Android app (APK) whenever the team app changes,
# and publishes it on the repo's Releases page so the team can download it on their phones.
name: Android app
on:
  push:
    branches: [main]
    paths: ['web/**', 'android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK not found on this runner"; exit 1; }
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare app files
        run: node build-www.mjs

      - name: Create Android project
        run: npx cap add android

      - name: Camera (QR scan, selfie) and location (attendance) permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$M"
          grep -n "permission\|uses-feature" "$M"

      - name: App icon and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sync
        run: npx cap sync android

      # Same key on every build, so new versions install over the old app.
      # To use your own private key later, add repo secrets ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD.
      - name: Build signed APK
        working-directory: android-app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$PWD/../signing/team-app.keystore"; PASS="zshirts-team"
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/own.keystore"; KS="$RUNNER_TEMP/own.keystore"; PASS="$KS_PASS"; fi
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=zshirts \
            -Pandroid.injected.signing.key.password="$PASS"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../Z-SHIRTS-Team.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Z-SHIRTS-Team-apk
          path: Z-SHIRTS-Team.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: team-app-v1.0.${{ github.run_number }}
          name: Z-SHIRTS Team app 1.0.${{ github.run_number }}
          body: |
            Download **Z-SHIRTS-Team.apk** on your Android phone and open it to install.
            First time: allow "Install unknown apps" for your browser when Android asks.
            Updating: just install the new APK over the old one — your login stays.
          files: Z-SHIRTS-Team.apk
          make_latest: true
