<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080A">
  <title>SINDIICAT · Oversized and Regular Fit tees</title>
  <meta name="description" content="Shop oversized t-shirts by SINDIICAT. 240 GSM heavy cotton, cash on delivery, easy size exchange, delivery across India.">
  <meta property="og:title" content="SINDIICAT · Big fits. Zero apologies.">
  <meta property="og:description" content="Oversized tees in heavy cotton. COD available, easy exchange.">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="announce" id="announce" aria-live="polite"></div>

  <header class="hdr" id="hdr">
    <div class="hdr-in">
      <button class="ic-btn only-m" id="btnMenu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <a class="logo" href="#/" aria-label="SINDIICAT home"><img src="brand/wordmark-white.png" alt="SINDIICAT"></a>
      <nav class="topnav only-d" id="topnav" aria-label="Shop sections"></nav>
      <button class="searchbar" id="btnSearch" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span id="searchHint">Search for tees, colours…</span>
      </button>
      <div class="hdr-icons">
        <a class="ic-btn only-d" href="#/account" id="hdrAcc" aria-label="My account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg><small id="accLabel">Login</small></a>
        <a class="ic-btn" href="#/wishlist" aria-label="Wishlist"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 5C19 15.6 12 20 12 20z"/></svg><b class="count" id="wishCount" hidden></b><small class="only-d">Wishlist</small></a>
        <a class="ic-btn" href="#/bag" id="hdrBag" aria-label="Bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg><b class="count" id="bagCount" hidden></b><small class="only-d">Bag</small></a>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot" id="foot"></footer>

  <nav class="tabbar" id="tabbar" aria-label="App">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Home</a>
    <a href="#/shop" data-tab="shop"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Shop</a>
    <a href="#/wishlist" data-tab="wishlist"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 5C19 15.6 12 20 12 20z"/></svg>Wishlist</a>
    <a href="#/bag" data-tab="bag"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Bag<b class="count" id="tabBagCount" hidden></b></a>
    <a href="#/account" data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.6-4 4.6-6 8-6s6.4 2 8 6"/></svg>Account</a>
  </nav>

  <div class="compare-tray" id="compareTray" hidden></div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel" hidden>
    <button class="sheet-x" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="search-ov" id="searchOv" hidden role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-top">
      <button class="ic-btn" id="searchBack" aria-label="Close search"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search for tees, colours, styles…" aria-label="Search products">
    </div>
    <div class="search-body" id="searchBody"></div>
  </div>

  <a class="wa-float" id="waFloat" hidden target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp">
    <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>
  </a>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="celebrate.js"></script>
  <script src="shop.js"></script>
</body>
</html>
